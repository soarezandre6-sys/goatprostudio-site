<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="theme-color" content="#070a10" />
  <title>Admin Suporte — GOAT PRO Studio</title>
  <link rel="icon" href="/assets/goatpro-icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body{min-height:100vh;background:#070a10;color:#f5f8ff}
    .admin-wrap{max-width:1180px;margin:0 auto;padding:54px 24px 96px}
    .admin-card,.dashboard-card,.detail-card{border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg,rgba(15,23,37,.97),rgba(8,12,20,.99));border-radius:20px;box-shadow:var(--shadow)}
    .admin-card{max-width:560px;margin:18px auto 0;padding:32px}
    .admin-card h1,.dashboard-card h1{margin:0 0 10px}
    .admin-card p,.muted{color:#9fb0c5;line-height:1.6}
    .admin-email{margin:20px 0;padding:14px 16px;border-radius:12px;background:#0a1019;border:1px solid rgba(255,255,255,.10);color:#dce7f6;font-weight:700;word-break:break-word}
    .admin-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
    .admin-btn{border:0;cursor:pointer}.admin-btn:disabled{opacity:.6;cursor:wait}
    .status{margin-top:18px;min-height:24px;font-size:14px;color:#a7b7ca}
    .status.ok{padding:14px;border-radius:12px;background:rgba(98,220,164,.08);border:1px solid rgba(98,220,164,.25);color:#baf0d5}
    .status.err{padding:14px;border-radius:12px;background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.25);color:#ffc3c3}
    #dashboard{display:none}.dashboard-visible{display:block!important}
    .dashboard-card{padding:28px}
    .dash-head,.detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
    .summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:24px 0}
    .summary-box,.detail-field{padding:18px;border-radius:14px;background:#0a1019;border:1px solid rgba(255,255,255,.08)}
    .summary-box span,.detail-field span{display:block;color:#8fa2ba;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .summary-box strong{display:block;margin-top:6px;font-size:28px;color:#f5f8ff}
    .ticket-list{display:grid;gap:12px;margin-top:18px}
    .ticket{padding:18px;border-radius:14px;background:#0b111b;border:1px solid rgba(255,255,255,.08);cursor:pointer;transition:.16s ease}
    .ticket:hover{border-color:rgba(53,168,255,.38);transform:translateY(-1px)}
    .ticket:focus{outline:2px solid rgba(53,168,255,.55);outline-offset:2px}
    .ticket-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
    .ticket-code{font-weight:900;color:#e6b85e}.ticket-status{font-size:12px;font-weight:900;padding:6px 9px;border-radius:999px;background:rgba(98,220,164,.09);border:1px solid rgba(98,220,164,.2);color:#baf0d5}
    .ticket h3{margin:10px 0 6px;font-size:18px}.ticket-meta{color:#8fa2ba;font-size:13px;line-height:1.55}.ticket-message{margin:12px 0 0;color:#cbd8e8;font-size:14px;line-height:1.55}.ticket-open-hint{margin-top:12px;color:#69bfff;font-size:12px;font-weight:800}
    .empty{padding:28px;text-align:center;color:#8fa2ba;border:1px dashed rgba(255,255,255,.12);border-radius:14px}
    .detail-card{display:none;margin-top:18px;padding:24px}.detail-card.visible{display:block}.detail-title{margin:6px 0 0;font-size:24px}
    .detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.detail-field strong,.detail-field div{display:block;margin-top:6px;color:#e7eef8;word-break:break-word}
    .conversation-title{margin:24px 0 12px;font-size:18px}.conversation{display:grid;gap:12px}.msg{max-width:78%;padding:15px 16px;border-radius:15px;border:1px solid rgba(255,255,255,.08)}
    .msg.customer{justify-self:start;background:#0a1019}.msg.support{justify-self:end;background:rgba(53,168,255,.10);border-color:rgba(53,168,255,.22)}.msg.system{justify-self:center;background:rgba(230,184,94,.08);border-color:rgba(230,184,94,.18)}
    .msg-head{display:flex;gap:10px;justify-content:space-between;color:#8fa2ba;font-size:11px;margin-bottom:8px}.msg-body{color:#e7eef8;line-height:1.6;white-space:pre-wrap;word-break:break-word}
    @media(max-width:760px){.summary,.detail-grid{grid-template-columns:1fr}.admin-wrap{padding:34px 16px 70px}.dashboard-card,.detail-card{padding:20px}.msg{max-width:100%}}
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="GOAT PRO Studio"><img src="/assets/goatpro-icon.svg" alt="" /><span><strong>GOAT PRO</strong> Studio</span></a>
    <nav><a href="/suporte/">Suporte</a><a href="/">Site</a></nav>
  </header>
  <main class="admin-wrap">
    <section id="loginCard" class="admin-card">
      <span class="eyebrow">ÁREA RESTRITA</span><h1>Painel de Suporte</h1>
      <p>Este painel é reservado à administração do GOAT PRO Studio. O acesso é feito por link seguro enviado por e-mail.</p>
      <div class="admin-email">soarezandre6@gmail.com</div>
      <div class="admin-actions"><button id="loginBtn" class="btn btn-primary admin-btn" type="button">Enviar link de acesso</button></div>
      <div id="loginStatus" class="status" role="status" aria-live="polite"></div>
    </section>
    <section id="dashboard">
      <div class="dashboard-card">
        <div class="dash-head">
          <div><span class="eyebrow">ADMINISTRAÇÃO</span><h1>Chamados de suporte</h1><div class="muted">Acesso administrativo confirmado.</div></div>
          <div class="admin-actions" style="margin-top:0"><button id="refreshBtn" class="btn admin-btn" type="button">Atualizar</button><button id="logoutBtn" class="btn admin-btn" type="button">Sair</button></div>
        </div>
        <div class="summary"><div class="summary-box"><span>Total</span><strong id="countTotal">0</strong></div><div class="summary-box"><span>Abertos</span><strong id="countOpen">0</strong></div><div class="summary-box"><span>Resolvidos</span><strong id="countResolved">0</strong></div></div>
        <div id="panelStatus" class="status" role="status" aria-live="polite"></div><div id="ticketList" class="ticket-list"></div>
      </div>
      <div id="ticketDetail" class="detail-card" aria-live="polite"></div>
    </section>
  </main>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
    const SUPABASE_URL='https://azlsdxckgvlkigttkkbr.supabase.co';
    const SUPABASE_KEY='sb_publishable_vr2UW8sIcLQoPaKIm0dy7w_clbZ2i0v';
    const ADMIN_EMAIL='soarezandre6@gmail.com';
    const REDIRECT_TO='https://goatprostudio.com.br/admin-suporte/';
    const ADMIN_API=`${SUPABASE_URL}/functions/v1/support-admin`;
    const supabase=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
    const $=id=>document.getElementById(id);
    const loginCard=$('loginCard'),loginBtn=$('loginBtn'),loginStatus=$('loginStatus'),dashboard=$('dashboard'),logoutBtn=$('logoutBtn'),refreshBtn=$('refreshBtn'),panelStatus=$('panelStatus'),ticketList=$('ticketList'),ticketDetail=$('ticketDetail'),countTotal=$('countTotal'),countOpen=$('countOpen'),countResolved=$('countResolved');
    let currentTickets=[];
    const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]));
    const cat=v=>({instalacao:'Instalação',licenca:'Licença / serial',camera:'Câmera',audio_video:'Áudio / vídeo',live_stack:'Live Stack',outro:'Outro'}[v]||v||'Outro');
    const st=v=>({open:'Aberto',waiting:'Aguardando cliente',resolved:'Resolvido',closed:'Encerrado'}[v]||v||'Aberto');
    const dt=v=>v?new Date(v).toLocaleString('pt-BR'):'';
    const who=m=>m.direction==='support'?'Suporte GOAT PRO Studio':m.direction==='customer'?'Cliente':'Sistema';

    function loggedOut(message=''){loginCard.style.display='block';dashboard.classList.remove('dashboard-visible');loginStatus.className='status';loginStatus.textContent=message;}

    function openTicket(index){
      const t=currentTickets[index]; if(!t)return;
      const messages=Array.isArray(t.goat_support_messages)?[...t.goat_support_messages].sort((a,b)=>new Date(a.created_at)-new Date(b.created_at)):[];
      const conversation=messages.length?messages.map(m=>`<div class="msg ${esc(m.direction)}"><div class="msg-head"><strong>${esc(who(m))}</strong><span>${esc(dt(m.created_at))}</span></div><div class="msg-body">${esc(m.body)}</div></div>`).join(''):'<div class="empty">Ainda não há mensagens registradas.</div>';
      ticketDetail.innerHTML=`<div class="detail-head"><div><span class="eyebrow">CHAMADO ${esc(t.ticket_code)}</span><h2 class="detail-title">${esc(t.subject)}</h2></div><button id="closeDetailBtn" class="btn admin-btn" type="button">Fechar</button></div>
      <div class="detail-grid"><div class="detail-field"><span>Status</span><strong>${esc(st(t.status))}</strong></div><div class="detail-field"><span>Categoria</span><strong>${esc(cat(t.category))}</strong></div><div class="detail-field"><span>Cliente</span><div>${esc(t.name)}</div></div><div class="detail-field"><span>E-mail</span><div>${esc(t.email)}</div></div><div class="detail-field"><span>E-mail da compra</span><div>${esc(t.purchase_email||'Não informado')}</div></div><div class="detail-field"><span>Aberto em</span><div>${esc(dt(t.created_at))}</div></div></div>
      <h3 class="conversation-title">Conversa</h3><div class="conversation">${conversation}</div>`;
      ticketDetail.classList.add('visible');$('closeDetailBtn')?.addEventListener('click',()=>ticketDetail.classList.remove('visible'));ticketDetail.scrollIntoView({behavior:'smooth',block:'start'});
    }

    async function loadTickets(session){
      panelStatus.className='status';panelStatus.textContent='Carregando chamados...';refreshBtn.disabled=true;
      try{
        const response=await fetch(ADMIN_API,{method:'GET',headers:{'Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_KEY}});
        const result=await response.json().catch(()=>({})); if(!response.ok||!result.ok)throw new Error(result.message||'Não foi possível carregar os chamados.');
        const tickets=Array.isArray(result.tickets)?result.tickets:[];currentTickets=tickets;countTotal.textContent=tickets.length;countOpen.textContent=tickets.filter(t=>t.status==='open').length;countResolved.textContent=tickets.filter(t=>t.status==='resolved'||t.status==='closed').length;panelStatus.textContent='';ticketDetail.classList.remove('visible');
        if(!tickets.length){ticketList.innerHTML='<div class="empty">Nenhum chamado encontrado.</div>';return;}
        ticketList.innerHTML=tickets.map((t,index)=>`<article class="ticket" role="button" tabindex="0" data-ticket-index="${index}" aria-label="Abrir chamado ${esc(t.ticket_code)}"><div class="ticket-top"><div class="ticket-code">${esc(t.ticket_code)}</div><div class="ticket-status">${esc(st(t.status))}</div></div><h3>${esc(t.subject)}</h3><div class="ticket-meta"><strong>${esc(t.name)}</strong> · ${esc(t.email)}<br>${esc(cat(t.category))} · ${esc(dt(t.created_at))}</div><div class="ticket-message">${esc(t.message)}</div><div class="ticket-open-hint">Clique para abrir o chamado</div></article>`).join('');
        ticketList.querySelectorAll('.ticket').forEach(el=>{const activate=()=>openTicket(Number(el.dataset.ticketIndex));el.addEventListener('click',activate);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate();}});});
      }catch(err){panelStatus.className='status err';panelStatus.textContent=err?.message||'Erro ao carregar os chamados.';ticketList.innerHTML='';}finally{refreshBtn.disabled=false;}
    }

    async function loggedIn(session){const email=String(session?.user?.email||'').toLowerCase();if(email!==ADMIN_EMAIL){await supabase.auth.signOut();loggedOut('Acesso não autorizado.');loginStatus.className='status err';return;}loginCard.style.display='none';dashboard.classList.add('dashboard-visible');await loadTickets(session);}
    loginBtn.addEventListener('click',async()=>{loginBtn.disabled=true;loginBtn.textContent='Enviando...';loginStatus.className='status';loginStatus.textContent='';try{const{error}=await supabase.auth.signInWithOtp({email:ADMIN_EMAIL,options:{emailRedirectTo:REDIRECT_TO}});if(error)throw error;loginStatus.className='status ok';loginStatus.textContent='Link enviado. Abra o e-mail e clique no link para entrar.';}catch(err){loginStatus.className='status err';loginStatus.textContent=err?.message||'Não foi possível enviar o link de acesso.';}finally{loginBtn.disabled=false;loginBtn.textContent='Enviar link de acesso';}});
    refreshBtn.addEventListener('click',async()=>{const{data:{session}}=await supabase.auth.getSession();if(session)await loadTickets(session);});
    logoutBtn.addEventListener('click',async()=>{await supabase.auth.signOut();loggedOut('Sessão encerrada.');});
    const{data:{session}}=await supabase.auth.getSession();if(session)await loggedIn(session);else loggedOut();
    supabase.auth.onAuthStateChange(async(_event,nextSession)=>{if(nextSession)await loggedIn(nextSession);else loggedOut();});
  </script>
</body>
</html>
